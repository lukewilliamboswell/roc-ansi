name: Set up Blueprint
description: >-
  Install Nix and the blueprint CLI, so that `blueprint run <task>` runs the
  repository's scripts in the environment Blueprint.lock pins.

# The CLI release must match the platform release named in Blueprint.roc.
# Update the version and the three sums together, from that release's
# blueprint.sha256.
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

    - name: Install the blueprint CLI
      shell: bash
      env:
        BLUEPRINT_VERSION: "0.4.0"
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            asset=blueprint-x86_64-linux
            sum=3fe15840aa1ae884a943e1973fbf07d67ae53d7a295edd32916f25c962df6480
            ;;
          Linux-ARM64)
            asset=blueprint-aarch64-linux
            sum=008e44c522ece7263d0871817e3b98693a57f8025878931423479638bba0e5bf
            ;;
          macOS-ARM64)
            asset=blueprint-aarch64-darwin
            sum=614f58813b91c344c90659cd161fd9afde309a5eab40b85e88ceb0ef4da21743
            ;;
          *)
            echo "No blueprint binary is released for $RUNNER_OS-$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac
        directory="$RUNNER_TEMP/blueprint"
        mkdir -p "$directory"
        curl --fail --silent --show-error --location \
          --output "$directory/blueprint" \
          "https://github.com/lukewilliamboswell/roc-blueprint/releases/download/$BLUEPRINT_VERSION/$asset"
        echo "$sum  $directory/blueprint" | shasum --algorithm 256 --check
        chmod +x "$directory/blueprint"
        echo "$directory" >> "$GITHUB_PATH"
