name: Set up Blueprint without Nix
description: Use the shared verified installer and artifact cache for this pure Roc package.

runs:
  using: composite
  steps:
    - name: Install stable Blueprint and restore downloaded artifacts
      uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@099956bfb1cb3c8f7d9b8e40da983e9bb0faf48f # verified manual badge evidence
      with:
        install-nix: 'false'
        cache: 'true'
        cache-workload: ${{ github.job }}

    # Validate the released platform contract and provision the embedded
    # configuration compiler before installing the floating package compiler.
    - name: Validate configuration and provision Blueprint compiler
      shell: bash
      run: |
        start=$SECONDS
        blueprint check
        elapsed=$((SECONDS - start))
        echo "Blueprint configuration bootstrap and validation: $elapsed seconds"
        printf '\n### Blueprint configuration bootstrap\n\n%s seconds, including embedded compiler provisioning, verification and configuration check.\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
