name: Set up Blueprint without Nix
description: Install the reviewed Blueprint release and cache its downloaded artifacts.

inputs:
  cache-suffix:
    description: Distinguish matrix workloads that fetch different tool subsets
    default: default

outputs:
  cache-hit:
    description: Whether this workflow job restored its exact locked artifact cache
    value: ${{ steps.downloads.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Download and verify Blueprint
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install.sh"

    - name: Locate the artifact cache
      id: store
      shell: bash
      run: echo "artifacts=${XDG_CACHE_HOME:-$HOME/.cache}/blueprint/v1/artifacts" >> "$GITHUB_OUTPUT"

    # Cache bytes only. Blueprint verifies them before rebuilding extracted trees.
    - name: Cache Blueprint downloads
      id: downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.artifacts }}
        # Different jobs fetch different subsets. A checks-only job must not
        # permanently claim the docs cache key before roc-docs is present.
        key: blueprint-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ inputs.cache-suffix }}-${{ hashFiles('Blueprint.lock', '.github/actions/setup-blueprint/install.sh') }}

    - name: Report the tool cache
      shell: bash
      env:
        ARTIFACTS: ${{ steps.store.outputs.artifacts }}
        CACHE_HIT: ${{ steps.downloads.outputs.cache-hit }}
      run: |
        echo "Blueprint artifact cache: exact hit=${CACHE_HIT:-false}; scope=${GITHUB_WORKFLOW}/${GITHUB_JOB}"
        echo "Artifact directory: $ARTIFACTS"
        if test -d "$ARTIFACTS"; then du -sh "$ARTIFACTS"; fi
        printf '\n### Blueprint tool cache\n\nExact cache hit: `%s`. See the cache step for transfer size and restore duration.\n' "${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"

    # Provision before the floating package compiler is installed. Otherwise a
    # matching compiler on PATH can leave the immutable cache without the fixed
    # configuration-compiler archive needed after the nightly advances.
    - name: Validate configuration and provision Blueprint compiler
      shell: bash
      run: |
        start=$SECONDS
        blueprint check
        elapsed=$((SECONDS - start))
        echo "Blueprint configuration bootstrap and validation: $elapsed seconds"
        printf '\n### Blueprint configuration bootstrap\n\n%s seconds, including any fixed compiler download, verification and configuration check.\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
