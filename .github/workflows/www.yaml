name: Deploy site and docs to Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/www.yaml"
      - "Blueprint.roc"
      - "Blueprint.lock"
      - "package/**"
      - "scripts/build_site.roc"
      - "scripts/src/**"
      - "examples/**"
      - "www/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Assemble the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix and blueprint
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7fdb8be46b12da9b119023c3a5aac28a9fdaa72b
        with:
          # From the roc-blueprint release that the platform URL in Blueprint.roc names.
          version: 0.4.0
          sha256-x86_64-linux: 3fe15840aa1ae884a943e1973fbf07d67ae53d7a295edd32916f25c962df6480
          sha256-aarch64-linux: 008e44c522ece7263d0871817e3b98693a57f8025878931423479638bba0e5bf
          sha256-aarch64-darwin: 614f58813b91c344c90659cd161fd9afde309a5eab40b85e88ceb0ef4da21743

      - name: Install the latest Roc nightly
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler

      - name: Assemble the site with the archived docs of each release
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_RELEASE_DOCS: "1"
          SITE_OUTPUT: pages-site
        run: blueprint run site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-site

  deploy:
    name: Deploy site and docs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
