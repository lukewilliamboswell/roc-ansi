name: Update Roc nightly
on:
  schedule:
    # Once daily, about four hours after the upstream 09:00 UTC build.
    - cron: "7 13 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: roc-nightly-update
  cancel-in-progress: false
jobs:
  update:
    # Ceiling only: the reusable workflow narrows permissions per job.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/update-roc-nightly.yml@f54c7aef59a7de19a5e3133a93cd1a415c1e2c60
