name: Update Roc nightly
on:
  schedule:
    # Once daily, about four hours after the upstream 09:00 UTC build.
    - cron: "7 13 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: roc-nightly-update
  cancel-in-progress: false
jobs:
  update:
    # Ceiling only: the reusable workflow narrows permissions per job.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/update-roc-nightly.yml@b34ee7488209489ed7a1ef436606c3d9ed8913be
