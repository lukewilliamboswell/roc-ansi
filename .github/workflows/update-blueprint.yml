name: Update Blueprint lock

# Proposes a refreshed Blueprint.lock: newer nixpkgs tools and a newer overlay
# revision. It proves nothing by itself; CI validates the pull request, and a
# maintainer reviews and merges it. There is no automatic merge.
#
# A lock update never changes which release is `roc-stable`, because that tag
# is written in Blueprint.roc.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-blueprint
  cancel-in-progress: false

jobs:
  update:
    name: Propose a lock update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automation/blueprint-lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix and blueprint
        uses: ./.github/actions/setup-blueprint

      - name: Update the lock
        run: blueprint update

      - name: Stop unless only Blueprint.lock changed
        id: changes
        run: |
          set -euo pipefail
          changed=$(git status --porcelain)
          if [ -z "$changed" ]; then
            echo "Blueprint.lock is already current."
            echo "update=false" >> "$GITHUB_OUTPUT"
          elif [ "$changed" = " M Blueprint.lock" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "blueprint update changed more than Blueprint.lock:" >&2
            echo "$changed" >&2
            exit 1
          fi

      # The commit is created through the API, so GitHub signs it.
      - name: Commit the lock to the update branch
        if: steps.changes.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          # Start the branch from the commit that was updated, replacing any earlier proposal.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --silent 2>/dev/null; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$base" -F force=true --silent
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$base" --silent
          fi
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg base "$base" \
            --arg contents "$(base64 --wrap=0 Blueprint.lock)" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repository, branchName: $branch },
                expectedHeadOid: $base,
                message: { headline: "Update Blueprint.lock" },
                fileChanges: { additions: [{ path: "Blueprint.lock", contents: $contents }] }
              } }
            }' |
            gh api graphql --input - --jq .data.createCommitOnBranch.commit.oid

      - name: Open the pull request
        if: steps.changes.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "The open pull request now carries the new lock."
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "Update Blueprint.lock" \
            --body "Refreshes the pinned inputs in \`Blueprint.lock\` with \`blueprint update\`. Only that file changes, and the \`roc-stable\` release named in \`Blueprint.roc\` stays the same.

          GitHub does not start workflows for pull requests opened by GitHub Actions. To check this one, close and reopen it, or run the CI workflow on the \`$BRANCH\` branch from the Actions tab."
