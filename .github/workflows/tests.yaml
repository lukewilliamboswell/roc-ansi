on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, or SHA to test. Defaults to the event's usual checkout."
        type: string
        required: false
        default: ""

permissions: {}

# this cancels workflows currently in progress if you start a new one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-examples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Read pinned Roc version
        id: roc-version
        run: python3 scripts/workflow_helpers.py roc-version --github-output "$GITHUB_OUTPUT"

      - name: Install Roc
        uses: roc-lang/setup-roc@bd311e2fb815a3d2255f7ee14a922f0b736e020b
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - run: roc version

      - run: python3 scripts/all_tests.py
