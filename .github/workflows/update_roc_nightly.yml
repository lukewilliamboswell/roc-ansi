name: Update Roc nightly

on:
  schedule:
    # Roc nightlies are normally published around 10:30 UTC.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: "Nightly tag to use instead of the latest published tag"
        required: false
        type: string

permissions: {}

concurrency:
  group: update-roc-nightly
  cancel-in-progress: false

env:
  BRANCH: update-roc-nightly

jobs:
  bump:
    name: Update the pin
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.bump.outputs.branch }}
      changed: ${{ steps.bump.outputs.changed }}
      nightly-tag: ${{ steps.latest.outputs.nightly-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest nightly
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.nightly_tag || '' }}
        run: |
          set -euo pipefail
          nightly_tag="$REQUESTED_TAG"
          if [ -z "$nightly_tag" ]; then
            nightly_tag="$(gh release view --repo roc-lang/nightlies --json tagName --jq .tagName)"
          fi
          case "$nightly_tag" in
            nightly-*) ;;
            *) echo "Invalid Roc nightly tag: $nightly_tag" >&2; exit 1 ;;
          esac
          echo "nightly-tag=$nightly_tag" >> "$GITHUB_OUTPUT"

      - name: Update the pinned version
        id: bump
        env:
          NIGHTLY_TAG: ${{ steps.latest.outputs.nightly-tag }}
        run: |
          set -euo pipefail
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$NIGHTLY_TAG" = "$(sed -n '1p' .roc-version)" ]; then
            echo "Already pinned to $NIGHTLY_TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$NIGHTLY_TAG" > .roc-version
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push the update branch
        if: steps.bump.outputs.changed == 'true'
        env:
          NIGHTLY_TAG: ${{ steps.latest.outputs.nightly-tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$BRANCH"
          git add .roc-version
          git commit --message "Update Roc nightly pin to $NIGHTLY_TAG"
          git push --force origin "$BRANCH"

  test:
    name: Test the proposed nightly
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yaml
    with:
      ref: ${{ needs.bump.outputs.branch }}

  pull-request:
    name: Report nightly compatibility
    needs: [bump, test]
    if: always() && needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.bump.outputs.nightly-tag }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$TEST_RESULT" = success ]; then
            status=":white_check_mark: All tests passed with this nightly."
          else
            status=":x: Tests finished with status \`$TEST_RESULT\`; this needs investigation before merging."
          fi
          title="Update Roc nightly pin to $NIGHTLY_TAG"
          body="$(printf '%s\n\n%s\n\n%s\n' \
            "Updates \`.roc-version\` to [\`$NIGHTLY_TAG\`](https://github.com/roc-lang/nightlies/releases/tag/$NIGHTLY_TAG)." \
            "$status See the [workflow run]($RUN_URL) for details." \
            "Created automatically by the \`Update Roc nightly\` workflow.")"
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --head "$BRANCH" --title "$title" --body "$body"
            pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$pr" --title "$title" --body "$body"
          fi

          if [ "$TEST_RESULT" = success ]; then
            gh pr merge "$pr" --squash --auto --delete-branch \
              || gh pr merge "$pr" --squash --delete-branch \
              || echo "::notice::Could not merge PR #$pr automatically; merge it manually."
          fi
