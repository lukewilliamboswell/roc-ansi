name: Documentation

# Renders the manual in docs/ and adds the API reference beside it. A pull
# request builds the site, so a broken manual fails review, and the result can
# be downloaded from the run. The default branch deploys it, and so does a
# final release, because the site leads with the latest release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the manual and site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install blueprint without Nix
        uses: ./.github/actions/setup-blueprint

      - name: Install the latest Roc nightly
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler

      # The first program in the manual names the latest release's bundle URL.
      - name: Provision and measure the locked documentation renderer
        id: renderer
        uses: lukewilliamboswell/roc-automation/actions/blueprint-tool@2f8bd90acbfba5b1e6e8a50a0ba3c29a7816f25d # shared release workflow
        with:
          task: docs-path
          label: roc-docs tools-0.4.0
          measure: 'true'
          output-directory: .docs-out

      - name: Write the parts of the manual that depend on what is released
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "${{ steps.renderer.outputs.measure-script }}" --label preparation --metrics "$RUNNER_TEMP/docs-preparation.json" -- blueprint run install-snippet

      - id: docs
        name: Render the manual as a site and a PDF
        uses: lukewilliamboswell/roc-automation/actions/build-docs@2f8bd90acbfba5b1e6e8a50a0ba3c29a7816f25d # shared release workflow
        with:
          renderer-binary: ${{ steps.renderer.outputs.binary }}
          site-url: https://lukewilliamboswell.github.io/roc-ansi/
          pdf-filename: roc-ansi.pdf
          docs-version: ${{ github.event_name == 'pull_request' && format('main (pull request {0})', github.event.number) || 'main' }}

      - name: Add the API reference of main and of each release
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_RELEASE_DOCS: "1"
          SITE_OUTPUT: ${{ steps.docs.outputs.site-directory }}
        run: python3 "${{ steps.renderer.outputs.measure-script }}" --label api --metrics "$RUNNER_TEMP/docs-api.json" --output "$SITE_OUTPUT" -- blueprint run site

      - name: Retain documentation measurements
        if: always() && steps.renderer.outputs.metrics-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-metrics-${{ github.job }}
          path: |
            ${{ steps.renderer.outputs.metrics-path }}
            ${{ runner.temp }}/docs-preparation.json
            ${{ runner.temp }}/docs-api.json
          retention-days: 7

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.docs.outputs.site-directory }}

  # Holds the Pages permissions, checks out nothing, and deploys the artifact
  # the build job produced.
  deploy:
    name: Deploy the site
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'release' && !github.event.release.prerelease))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
