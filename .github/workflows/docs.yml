name: Documentation

# Renders the manual in docs/ and adds the API reference beside it. A pull
# request builds the site, so a broken manual fails review, and the result can
# be downloaded from the run. Only the default branch deploys it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the manual and site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install blueprint without Nix
        uses: ./.github/actions/setup-blueprint

      - name: Install the latest Roc nightly
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler

      # The first program in the manual names the latest release's bundle URL.
      - name: Write the parts of the manual that depend on what is released
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/actions/setup-docs/measure.sh "Generate manual inputs" blueprint run install-snippet

      - name: Set up the native documentation renderer
        id: docs-renderer
        uses: ./.github/actions/setup-docs

      - id: docs
        name: Render the manual as a site and a PDF
        uses: lukewilliamboswell/roc-automation/actions/build-docs@dec2d52a5cb6cd251fd188ad1d797f400ee1bb6e # tools-0.1.0-rc.1
        with:
          backend: roc
          renderer-binary: ${{ steps.docs-renderer.outputs.renderer-binary }}
          pdf-filename: roc-ansi.pdf
          docs-version: ${{ github.event_name == 'pull_request' && format('main (pull request {0})', github.event.number) || 'main' }}

      - name: Add the API reference of main and of each release
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_RELEASE_DOCS: "1"
          SITE_OUTPUT: ${{ steps.docs.outputs.site-directory }}
        run: bash .github/actions/setup-docs/measure.sh "Assemble API and release documentation" blueprint run site

      - name: Report documentation output sizes
        if: always()
        run: |
          if test -d .docs-out; then
            du -ah .docs-out | sort -h | tail -20
            { printf '\n### Documentation output sizes\n\n```text\n'; du -sh .docs-out/site .docs-out/*.pdf; printf '```\n'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload stage measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-metrics-${{ github.job }}
          path: .roc-ansi-tmp/ci-metrics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.docs.outputs.site-directory }}

  # Holds the Pages permissions, checks out nothing, and deploys the artifact
  # the build job produced.
  deploy:
    name: Deploy the site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
