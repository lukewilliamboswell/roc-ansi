name: Release

# Run by hand with a version to publish a release. A pull request runs the same
# build and tests as a dry run, under a version that is never published.
#
# Everything a release holds is built once, tested as those exact files, and
# only then published, in one step. Nothing pins the package compiler: the
# release is built and tested with the latest Roc nightly, and its notes record
# which one that was.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 0.14.0, or 0.14.0-rc1 for a release candidate"
        required: true
        type: string
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-dry-run-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    # This name is a required status check in the branch ruleset.
    name: Build release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
      nightly_tag: ${{ steps.nightly.outputs.tag }}
      bundle_filename: ${{ steps.sbom_inputs.outputs.bundle }}

    steps:
      - name: Require the default branch for publication
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF_TYPE" = branch && test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" || { echo "Releases must run from the default branch" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Resolved once here, so every job of this run uses the same compiler.
      - name: Resolve the latest Roc nightly
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Install blueprint without Nix
        uses: ./.github/actions/setup-blueprint

      - name: Install the latest Roc nightly
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.nightly.outputs.tag }}

      # Rejects a version whose tag or release already exists.
      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          # Roc rejects 0.0.0 in a package URL, so this is the lowest version.
          dry_run_version: 0.0.1-dryrun
          github_token: ${{ github.token }}

      # Requires the release notes, and stops a version that understates what
      # changed in the package's API since the latest release.
      - name: Check the version with roc bump
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: blueprint run check-version

      - name: Check the scripts, package, examples and release artifacts
        run: blueprint run check

      - name: Bundle the package
        run: blueprint run bundle

      # The archived examples depend on this release's bundle URL, which is
      # known before the release exists: version and bundle name fix it.
      - name: Package the examples archive
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: blueprint run package-examples

      - name: Package the API documentation
        env:
          DOCS_VERSION: ${{ steps.validate.outputs.release_version }}
        run: blueprint run package-docs

      - name: Provision and measure the locked documentation renderer
        id: renderer
        uses: lukewilliamboswell/roc-automation/actions/blueprint-tool@7aff4132691ad4fc348abe9df146a57512b49bd6 # tools-0.4.0
        with:
          task: docs-path
          label: roc-docs tools-0.4.0
          measure: 'true'
          output-directory: .docs-out


      - name: Check committed source and prepare the reviewed composition
        id: sbom_inputs
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: |
          set -euo pipefail
          python3 "${{ steps.renderer.outputs.measure-script }}" --label source-sbom-prepare --metrics "$RUNNER_TEMP/source-sbom-prepare.json" -- blueprint run prepare-sbom
          cp LICENSE dist/LICENSE
          bundles=(dist/*.tar.zst)
          test "${#bundles[@]}" = 1
          printf 'bundle=%s\n' "$(basename "${bundles[0]}")" >> "$GITHUB_OUTPUT"
          printf 'started=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Generate and check SBOMs with the shared native tool
        id: sbom
        uses: lukewilliamboswell/roc-automation/actions/sbom-sidecars@7aff4132691ad4fc348abe9df146a57512b49bd6 # tools-0.4.0
        with:
          files: dist/${{ steps.sbom_inputs.outputs.bundle }}
          version: ${{ steps.validate.outputs.release_version }}
          target: source
          author: 'Person: Luke Boswell'
          composition: .blueprint/sbom/prepared/composition.json
          archive-members: reviewed
          spdx-2-3: 'true'
          url-base: https://github.com/${{ github.repository }}/releases/download/${{ steps.validate.outputs.release_version }}
          namespace-base: https://github.com/${{ github.repository }}/sbom/${{ steps.validate.outputs.release_version }}

      - name: Retain shared SBOM evidence and inventory
        env:
          BUNDLE: ${{ steps.sbom_inputs.outputs.bundle }}
          INVENTORY: ${{ steps.sbom.outputs.inventory }}
          EVIDENCE: ${{ steps.sbom.outputs.evidence }}
          STARTED: ${{ steps.sbom_inputs.outputs.started }}
        run: |
          set -euo pipefail
          cp "$INVENTORY" "dist/$BUNDLE.sbom-inventory.json"
          cp "$EVIDENCE" "dist/$BUNDLE.sbom-evidence.json"
          elapsed=$(( $(date +%s) - STARTED ))
          printf '\n### Shared native SBOM generation\n\n%s seconds, including tool download, inspection, binding and checks.\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache the independent SBOM schema validator downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: sbom-validator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sbom/validator-requirements.txt') }}

      - name: Independently validate the SPDX standard schema
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sbom-validator"
          "$RUNNER_TEMP/sbom-validator/bin/pip" install --require-hashes -r sbom/validator-requirements.txt
          printf '%s  %s\n' 4126dc29f15e92feec92e9622f4939131ad58b125d6f578aa93e980a6e6f3212 sbom/schema/spdx-2.3.schema.json | sha256sum -c -
          "$RUNNER_TEMP/sbom-validator/bin/check-jsonschema" --schemafile sbom/schema/roc-ansi-source.schema.json dist/*.spdx-2.3.json

      - name: Source SBOMs enter source and native inventories
        run: |
          set -euo pipefail
          fixture=tests/supply-chain/blueprint-source-import
          for target in source x86_64-linux aarch64-linux; do
            blueprint run sbom-tool -- inspect "$fixture/Spec" "$fixture/Lock" "$fixture/composition.json" "$target" "$RUNNER_TEMP/source-import-$target.json"
          done
          jq '.imported_documents[0].sha256 = ("0" * 64)' "$fixture/composition.json" > "$RUNNER_TEMP/bad-supplier.json"
          if blueprint run sbom-tool -- inspect "$fixture/Spec" "$fixture/Lock" "$RUNNER_TEMP/bad-supplier.json" x86_64-linux "$RUNNER_TEMP/invalid-import.json" > "$RUNNER_TEMP/invalid-import.log" 2>&1; then
            echo 'A modified supplier document was accepted' >&2
            exit 1
          fi
          grep -F 'imported SBOM content digest mismatch' "$RUNNER_TEMP/invalid-import.log"

      # The manual attached to a release names that release.

      - name: Write the parts of the manual that depend on what is released
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: python3 "${{ steps.renderer.outputs.measure-script }}" --label preparation --metrics "$RUNNER_TEMP/docs-preparation.json" -- blueprint run install-snippet

      - id: docs
        name: Render the manual as a PDF
        uses: lukewilliamboswell/roc-automation/actions/build-docs@7aff4132691ad4fc348abe9df146a57512b49bd6 # tools-0.4.0
        with:
          renderer-binary: ${{ steps.renderer.outputs.binary }}
          site-url: https://lukewilliamboswell.github.io/roc-ansi/
          pdf-filename: roc-ansi-${{ steps.validate.outputs.release_version }}.pdf
          docs-version: ${{ steps.validate.outputs.release_version }}

      # Renders docs/releases/<version>.adoc with the real bundle URL and the
      # compilers used. A dry run renders the newest notes there are.
      - name: Render the release notes
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: blueprint run release-notes

      # Everything the release would hold, and its notes. Later jobs use these
      # files and build nothing.
      - name: Retain documentation measurements
        if: always() && steps.renderer.outputs.metrics-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-metrics-${{ github.job }}
          path: |
            ${{ steps.renderer.outputs.metrics-path }}
            ${{ runner.temp }}/docs-preparation.json
            ${{ runner.temp }}/docs-api.json
            ${{ runner.temp }}/source-sbom-prepare.json
          retention-days: 7

      - name: Upload the release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: |
            ${{ steps.sbom.outputs.assets }}
            dist/*.sbom-inventory.json
            dist/*.sbom-evidence.json
            dist/*.sbom-members.json
            dist/*.sbom-manifest.json
            dist/LICENSE
            dist/roc-ansi-examples-*.zip
            dist/roc-ansi-docs-*.zip
            .docs-out/roc-ansi-*.pdf
            .release/release-notes.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    # This name is a required status check in the branch ruleset.
    name: Test default bundle (ubuntu-latest)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install blueprint without Nix
        uses: ./.github/actions/setup-blueprint

      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.build.outputs.nightly_tag }}

      - name: Download the release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate

      # The archive names the release URL of the bundle, which does not exist
      # yet: the bundle is served from a loopback address in its place.
      - name: Test the examples archive, unchanged, against the bundle
        run: blueprint run test-bundle

  # Holds the write token, checks out nothing, and runs no code from this
  # repository: it publishes the files the jobs above built and tested.
  publish:
    name: Publish GitHub release
    needs:
      - build
      - test-bundles
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment:
      name: release

    steps:
      - name: Download the release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: candidate

      # This job checks out nothing and executes no candidate source. Attest
      # the exact tested files, retaining both statements for downstream use.
      - name: Require the source bundle and its complete SBOM sidecar set
        env:
          BUNDLE: ${{ needs.build.outputs.bundle_filename }}
          VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE"
          test "$(basename "$BUNDLE")" = "$BUNDLE"
          for suffix in '' .spdx.json .spdx-2.3.json .cdx.json .sbom-inventory.json .sbom-evidence.json .sbom-members.json .sbom-manifest.json; do
            test -f "candidate/dist/$BUNDLE$suffix"
            test ! -L "candidate/dist/$BUNDLE$suffix"
          done
          digest=$(sha256sum "candidate/dist/$BUNDLE" | cut -d ' ' -f 1)
          bytes=$(wc -c < "candidate/dist/$BUNDLE")
          inventory=$(sha256sum "candidate/dist/$BUNDLE.sbom-inventory.json" | cut -d ' ' -f 1)
          # Treat the shared envelope as data: independently bind it to this
          # run and every actual candidate file before either signing action.
          jq -e --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg workflow "$GITHUB_WORKFLOW_REF" \
            --arg file "$BUNDLE" --arg version "$VERSION" --arg sha "$digest" --argjson size "$bytes" --arg inventory "$inventory" \
            '.format == "roc-automation-sbom-evidence-v1" and .source.server == "https://github.com" and .source.repository == "lukewilliamboswell/roc-ansi" and .source.commit == $commit and .producer.run_id == $run and .producer.run_attempt == $attempt and .producer.workflow == $workflow and (.subjects | length) == 1 and .subjects[0].name == $file and .subjects[0].path == ("dist/"+$file) and .subjects[0].version == $version and .subjects[0].target == "source" and .subjects[0].sha256 == $sha and .subjects[0].size == $size and .subjects[0].inventory_sha256 == $inventory and (.subjects[0].sidecars | length) == 4' \
            "candidate/dist/$BUNDLE.sbom-evidence.json"
          for suffix in .spdx.json .spdx-2.3.json .cdx.json .sbom-manifest.json; do
            case "$suffix" in
              .spdx.json) format=SPDX-3.0.1 ;;
              .spdx-2.3.json) format=SPDX-2.3 ;;
              .cdx.json) format=CycloneDX-1.7 ;;
              .sbom-manifest.json) format=manifest ;;
            esac
            sha=$(sha256sum "candidate/dist/$BUNDLE$suffix" | cut -d ' ' -f 1)
            size=$(wc -c < "candidate/dist/$BUNDLE$suffix")
            jq -e --arg file "$BUNDLE$suffix" --arg sha "$sha" --argjson size "$size" --arg format "$format" \
              '[.subjects[0].sidecars[] | select(.name == $file and .path == ("dist/"+$file) and .sha256 == $sha and .size == $size and .format == $format)] | length == 1' \
              "candidate/dist/$BUNDLE.sbom-evidence.json"
          done
          jq -e --arg file "$BUNDLE" --arg version "$VERSION" --arg sha "$digest" --argjson size "$bytes" --arg inventory "$inventory" \
            '.profile == "blueprint-spdx-3.0-v1" and .subject.filename == $file and .subject.version == $version and .subject.target == "source" and .subject.sha256 == $sha and .subject.size == $size and .inventory_sha256 == $inventory and [.sidecars[] | {filename,format}] == [{filename:($file+".cdx.json"),format:"cyclonedx-1.7"},{filename:($file+".spdx.json"),format:"spdx-3.0.1"}]' \
            "candidate/dist/$BUNDLE.sbom-manifest.json"
          jq -e --slurpfile evidence "candidate/dist/$BUNDLE.sbom-evidence.json" \
            'all(.sidecars[]; . as $item | any($evidence[0].subjects[0].sidecars[]; .name == $item.filename and .sha256 == $item.sha256 and .size == $item.size))' \
            "candidate/dist/$BUNDLE.sbom-manifest.json"
          jq -e --arg file "$BUNDLE" --arg sha "$digest" '.archive == $file and .sha256 == $sha and (.members | length) > 0' "candidate/dist/$BUNDLE.sbom-members.json"
          jq -e --slurpfile inventory "candidate/dist/$BUNDLE.sbom-inventory.json" \
            'all(.members[]; . as $member | any($inventory[0].components[]; .name == $member.name and .sha256 == $member.sha256))' "candidate/dist/$BUNDLE.sbom-members.json"
          jq -e --arg file "$BUNDLE" --arg version "$VERSION" --arg sha "$digest" \
            '[.packages[] | select(.SPDXID == "SPDXRef-Subject")] | length == 1 and .[0].name == $file and .[0].versionInfo == $version and .[0].checksums == [{algorithm:"SHA256",checksumValue:$sha}]' \
            "candidate/dist/$BUNDLE.spdx-2.3.json"
          for file in "candidate/dist/LICENSE" "candidate/dist/roc-ansi-examples-$VERSION.zip" "candidate/dist/roc-ansi-docs-$VERSION.zip" "candidate/.docs-out/roc-ansi-$VERSION.pdf"; do
            test -f "$file" && test ! -L "$file"
          done
          assets=(candidate/dist/* candidate/.docs-out/*.pdf)
          test "${#assets[@]}" = 12

      - name: Attest the tested release assets and SBOM evidence
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            candidate/dist/*
            candidate/.docs-out/*.pdf
          create-storage-record: false

      - name: Attest source bundle composition
        id: composition
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate/dist/${{ needs.build.outputs.bundle_filename }}
          sbom-path: candidate/dist/${{ needs.build.outputs.bundle_filename }}.spdx-2.3.json
          create-storage-record: false

      - name: Retain and verify authenticated release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ needs.build.outputs.bundle_filename }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          COMPOSITION: ${{ steps.composition.outputs.bundle-path }}
        run: |
          set -euo pipefail
          policy=(--repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners)
          for asset in candidate/dist/* candidate/.docs-out/*.pdf; do
            gh attestation verify "$asset" "${policy[@]}" --bundle "$PROVENANCE"
          done
          gh attestation verify "candidate/dist/$BUNDLE" "${policy[@]}" --predicate-type https://spdx.dev/Document/v2.3 --bundle "$COMPOSITION"
          cp "$PROVENANCE" candidate/dist/roc-ansi-provenance.sigstore.json
          cp "$COMPOSITION" candidate/dist/roc-ansi-sbom.sigstore.json

      # A published release is never completed or corrected afterwards. So
      # every asset goes onto a draft, is downloaded back and compared with
      # the tested file, and only then is the release published.
      - name: Publish the tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          assets=(candidate/dist/* candidate/.docs-out/*.pdf)

          # gh release create refuses an existing release; refuse an existing tag too.
          tags=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_VERSION" --jq "[.[] | select(.ref == \"refs/tags/$RELEASE_VERSION\")] | length")
          test "$tags" = 0

          gh release create "$RELEASE_VERSION" --draft --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" --prerelease="$IS_PRERELEASE" \
            --notes-file candidate/.release/release-notes.md "${assets[@]}"

          mkdir published
          gh release download "$RELEASE_VERSION" --dir published
          for asset in "${assets[@]}"; do
            cmp "$asset" "published/$(basename "$asset")"
          done
          test "$(find published -type f | wc -l)" = "${#assets[@]}"

          gh release edit "$RELEASE_VERSION" --draft=false

  # A final release changes which release is the latest, so the site is
  # rebuilt. A release candidate does not change the site.
  build-site:
    name: Build the manual and site
    needs:
      - build
      - publish
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install blueprint without Nix
        uses: ./.github/actions/setup-blueprint

      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.build.outputs.nightly_tag }}

      # The release is published, so it is now the latest one the manual names.
      - name: Provision and measure the locked documentation renderer
        id: renderer
        uses: lukewilliamboswell/roc-automation/actions/blueprint-tool@7aff4132691ad4fc348abe9df146a57512b49bd6 # tools-0.4.0
        with:
          task: docs-path
          label: roc-docs tools-0.4.0
          measure: 'true'
          output-directory: .docs-out

      - name: Write the parts of the manual that depend on what is released
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "${{ steps.renderer.outputs.measure-script }}" --label preparation --metrics "$RUNNER_TEMP/docs-preparation.json" -- blueprint run install-snippet

      - id: docs
        name: Render the manual as a site and a PDF
        uses: lukewilliamboswell/roc-automation/actions/build-docs@7aff4132691ad4fc348abe9df146a57512b49bd6 # tools-0.4.0
        with:
          renderer-binary: ${{ steps.renderer.outputs.binary }}
          site-url: https://lukewilliamboswell.github.io/roc-ansi/
          pdf-filename: roc-ansi.pdf
          docs-version: main

      - name: Add the API reference of main and of each release
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_RELEASE_DOCS: "1"
          SITE_OUTPUT: ${{ steps.docs.outputs.site-directory }}
        run: python3 "${{ steps.renderer.outputs.measure-script }}" --label api --metrics "$RUNNER_TEMP/docs-api.json" --output "$SITE_OUTPUT" -- blueprint run site

      - name: Retain documentation measurements
        if: always() && steps.renderer.outputs.metrics-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-metrics-${{ github.job }}
          path: |
            ${{ steps.renderer.outputs.metrics-path }}
            ${{ runner.temp }}/docs-preparation.json
            ${{ runner.temp }}/docs-api.json
            ${{ runner.temp }}/source-sbom-prepare.json
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.docs.outputs.site-directory }}

  # Holds the Pages permissions, checks out nothing, and deploys the artifact
  # the job above built.
  deploy-pages:
    name: Deploy the site
    needs: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
