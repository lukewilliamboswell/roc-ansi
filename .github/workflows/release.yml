name: Release

# Run by hand with a version to publish a release. A pull request runs the same
# build and tests as a dry run, and publishes nothing.
#
# Nothing pins the package compiler: the release is built and tested with the
# latest Roc nightly, and its notes record which one that was.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 0.14.0"
        required: true
        type: string
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-dry-run-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    # This name is a required status check in the branch ruleset.
    name: Build release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      docs_version: ${{ steps.validate.outputs.docs_version }}
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}
      nightly_tag: ${{ steps.nightly.outputs.tag }}

    steps:
      - name: Require the default branch for publication
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF_TYPE" = branch && test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" || { echo "Releases must run from the default branch" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Resolved once here, so every job of this run uses the same compiler.
      - name: Resolve the latest Roc nightly
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Install Nix and blueprint
        uses: ./.github/actions/setup-blueprint

      - name: Install the latest Roc nightly
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.nightly.outputs.tag }}

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          github_token: ${{ github.token }}

      - name: Check the scripts, package, examples and release artifacts
        run: blueprint run check

      - name: Resolve previous release
        if: github.event_name == 'workflow_dispatch'
        id: previous
        uses: roc-lang/release-package/actions/resolve-previous-release@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          github_token: ${{ github.token }}

      - name: Check version bump
        uses: roc-lang/release-package/actions/run-bump-check@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ steps.validate.outputs.release_version }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          # Nightly compilers can make previous release bundles uncompilable.
          # Restore `require` once Roc 0.1.0 provides a stable compatibility baseline.
          bump_check: warn
          bump_entrypoint: package/main.roc
          previous_url: ${{ steps.previous.outputs.previous_url }}

      - name: Classify bump output for release notes
        run: |
          bump_output=".release/bump-output.txt"
          if [[ ! -s "$bump_output" ]]; then
            exit 0
          fi
          if grep -Eq '^(Comparing |roc bump check skipped|No previous release bundle found;)' "$bump_output"; then
            exit 0
          fi
          {
            echo "roc bump check skipped because no API comparison was produced."
            echo
            cat "$bump_output"
          } > "$bump_output.tmp"
          mv "$bump_output.tmp" "$bump_output"

      - name: Bundle the package
        run: blueprint run bundle

      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          bundle_glob: dist/*.tar.zst
          test_os_json: '["ubuntu-latest"]'

      # The archived examples depend on this release's bundle URL, which is
      # known before the release exists: version and bundle name fix it.
      - name: Package the examples archive
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.release_version }}
        run: blueprint run package-examples

      - name: Package the API documentation
        env:
          DOCS_VERSION: ${{ steps.validate.outputs.docs_version }}
        run: blueprint run package-docs

      - name: Record the compilers for the release notes
        run: blueprint run record-compilers

      - name: Upload release bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundles
          path: .release/bundles/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: |
            .release/bump-output.txt
            .release/compilers.md
            .release/previous-url.txt
            .release/release-bundles.json
            .release/test-matrix.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the examples archive and API documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/roc-ansi-examples-*.zip
            dist/roc-ansi-docs-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    # "Test default bundle (ubuntu-latest)" is a required status check in the
    # branch ruleset.
    name: Test ${{ matrix.bundle_name }} bundle (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.test_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix and blueprint
        uses: ./.github/actions/setup-blueprint

      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.build.outputs.nightly_tag }}

      - name: Download release bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundles
          path: .release/test-bundles

      - name: Test the examples against the bundle
        env:
          BUNDLE_PATH: .release/test-bundles/${{ matrix.artifact_file }}
        run: blueprint run test-bundle

  # Holds the write token, and runs no code from this repository.
  publish-release:
    name: Publish GitHub release
    needs:
      - build
      - test-bundles
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    environment:
      name: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: .release

      - name: Make release notes
        uses: roc-lang/release-package/actions/make-release-notes@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          docs_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ needs.build.outputs.docs_version }}/
          github_token: ${{ github.token }}

      - name: Name the compilers in the release notes
        run: cat .release/compilers.md >> .release/release-notes.md

      - name: Publish release
        uses: roc-lang/release-package/actions/publish-release@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          github_token: ${{ github.token }}

  # The bundle now has its public URL, so the archive built before publication
  # can be run exactly as people will download it.
  test-published-examples:
    name: Test the examples archive against the published bundle
    needs:
      - build
      - publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix and blueprint
        uses: ./.github/actions/setup-blueprint

      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.build.outputs.nightly_tag }}

      - name: Download the examples archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Test the examples archive as published
        env:
          EXAMPLES_ARCHIVE: dist/roc-ansi-examples-${{ needs.build.outputs.release_version }}.zip
        run: blueprint run test-published

  # Holds the write token, and runs no code from this repository.
  attach-assets:
    name: Attach the examples archive and API documentation
    needs:
      - build
      - test-published-examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment:
      name: release

    steps:
      - name: Download the examples archive and API documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          DOCS_VERSION: ${{ needs.build.outputs.docs_version }}
        run: |
          gh release upload "$RELEASE_VERSION" \
            "dist/roc-ansi-examples-$RELEASE_VERSION.zip" \
            "dist/roc-ansi-docs-$DOCS_VERSION.tar.gz" \
            --repo "$GITHUB_REPOSITORY"

  build-site:
    name: Assemble the documentation site
    needs:
      - build
      - attach-assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix and blueprint
        uses: ./.github/actions/setup-blueprint

      - name: Install the Roc nightly this run resolved
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.build.outputs.nightly_tag }}

      - name: Assemble the site with the archived docs of each release
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_RELEASE_DOCS: "1"
          SITE_OUTPUT: pages-site
        run: blueprint run site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-site

  deploy-pages:
    name: Deploy versioned docs
    needs: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
