name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 0.9.0"
        required: true
        type: string
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      docs_version: ${{ steps.validate.outputs.docs_version }}
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned Roc version
        id: roc-version
        run: python3 scripts/workflow_helpers.py roc-version --github-output "$GITHUB_OUTPUT"

      - name: Install Roc
        uses: roc-lang/setup-roc@bd311e2fb815a3d2255f7ee14a922f0b736e020b
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          github_token: ${{ github.token }}

      - name: Validate package
        run: python3 scripts/all_tests.py

      - name: Resolve previous release
        if: github.event_name == 'workflow_dispatch'
        id: previous
        uses: roc-lang/release-package/actions/resolve-previous-release@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          github_token: ${{ github.token }}

      - name: Check version bump
        uses: roc-lang/release-package/actions/run-bump-check@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ steps.validate.outputs.release_version }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          # Nightly compilers can make previous release bundles uncompilable.
          # Restore `require` once Roc 0.1.0 provides a stable compatibility baseline.
          bump_check: warn
          bump_entrypoint: package/main.roc
          previous_url: ${{ steps.previous.outputs.previous_url }}

      - name: Classify bump output for release notes
        run: |
          bump_output=".release/bump-output.txt"
          if [[ ! -s "$bump_output" ]]; then
            exit 0
          fi
          if grep -Eq '^(Comparing |roc bump check skipped|No previous release bundle found;)' "$bump_output"; then
            exit 0
          fi
          {
            echo "roc bump check skipped because no API comparison was produced."
            echo
            cat "$bump_output"
          } > "$bump_output.tmp"
          mv "$bump_output.tmp" "$bump_output"

      - name: Bundle package
        run: python3 scripts/bundle.py --output-dir dist

      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          bundle_glob: dist/*.tar.zst
          test_os_json: '["ubuntu-latest"]'

      - name: Upload release bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: .release/bundles/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            .release/bump-output.txt
            .release/previous-url.txt
            .release/release-bundles.json
            .release/test-matrix.json
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    name: Test ${{ matrix.bundle_name }} bundle (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.test_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Roc version
        id: roc-version
        run: python3 scripts/workflow_helpers.py roc-version --github-output "$GITHUB_OUTPUT"

      - name: Install Roc
        uses: roc-lang/setup-roc@bd311e2fb815a3d2255f7ee14a922f0b736e020b
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: .release/test-bundles

      - name: Test release bundle
        uses: roc-lang/release-package/actions/test-bundle@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          test_bundle_command: python3 scripts/test_bundle_examples.py --bundle-path
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.build.outputs.release_version }}

  publish-release:
    name: Publish GitHub release
    needs:
      - build
      - test-bundles
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .release

      - name: Make release notes
        uses: roc-lang/release-package/actions/make-release-notes@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          docs_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ needs.build.outputs.docs_version }}/
          github_token: ${{ github.token }}

      - name: Publish release
        uses: roc-lang/release-package/actions/publish-release@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          github_token: ${{ github.token }}

  prepare-docs:
    name: Prepare versioned docs
    needs:
      - build
      - publish-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    environment:
      name: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Roc version
        id: roc-version
        run: python3 scripts/workflow_helpers.py roc-version --github-output "$GITHUB_OUTPUT"

      - name: Install Roc
        uses: roc-lang/setup-roc@bd311e2fb815a3d2255f7ee14a922f0b736e020b
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .release

      - name: Resolve release bundle URL
        id: bundle-url
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: python3 scripts/workflow_helpers.py bundle-url --metadata .release/release-bundles.json --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --github-output "$GITHUB_OUTPUT"

      - name: Update example package URLs
        env:
          BUNDLE_URL: ${{ steps.bundle-url.outputs.bundle-url }}
        run: python3 scripts/update_example_urls.py --bundle-url "$BUNDLE_URL"

      - name: Validate updated examples
        run: python3 scripts/workflow_helpers.py validate-examples

      - name: Snapshot existing docs
        uses: roc-lang/release-package/actions/docs-snapshot@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          docs_root: www

      - name: Generate docs
        env:
          DOCS_VERSION: ${{ needs.build.outputs.docs_version }}
        run: python3 scripts/generate_docs.py --docs-root www --skip-index

      - name: Update docs index
        uses: roc-lang/release-package/actions/docs-index@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          docs_root: www
          docs_version: ${{ needs.build.outputs.docs_version }}

      - name: Validate docs
        uses: roc-lang/release-package/actions/docs-validate@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          docs_root: www
          docs_version: ${{ needs.build.outputs.docs_version }}

      - name: Create docs and examples follow-up PR
        uses: roc-lang/release-package/actions/create-followup-pr@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          paths: examples www
          base_branch: ${{ github.ref_name }}
          commit_message: Update docs and examples for ${{ needs.build.outputs.release_version }}
          pr_title: Update docs and examples for ${{ needs.build.outputs.release_version }}
          pr_body: |
            Release follow-up for ${{ needs.build.outputs.release_version }}.

            Updated generated docs and checked-in example package URLs.
          github_token: ${{ github.token }}

      - name: Assemble Pages site
        run: python3 scripts/assemble_www.py --output pages-site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy-pages:
    name: Deploy versioned docs
    needs: prepare-docs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
