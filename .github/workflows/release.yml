name: Release

# A pull request builds and tests the release under a version that is never
# published: the package's own checks, the examples against the working tree,
# then the exact bundle, examples archive, API docs archive, SBOM sidecars and
# manual, and the archived examples against that bundle. Dispatch from main
# with a version to publish the same files. The shared workflow owns the jobs;
# this repository owns its package, examples, notes and Blueprint tasks.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, such as 0.14.0, or 0.14.0-rc1 for a release candidate; empty runs the dry run"
        type: string
        default: ""
      nightly-tag:
        description: "Exact Roc nightly for a diagnostic run; empty resolves the latest"
        type: string
        default: ""

permissions: {}

jobs:
  Release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/release-package.yml@099956bfb1cb3c8f7d9b8e40da983e9bb0faf48f
    with:
      version: ${{ inputs.version || '' }}
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      check-task: check
      sbom-author: "Person: Luke Boswell"
      sbom-task: prepare-sbom
      manual: true
      docs-task: install-snippet

  refresh-site:
    name: Refresh the site after a final release
    needs: Release
    if: inputs.version != '' && !contains(inputs.version, '-')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Releases created with GITHUB_TOKEN do not trigger release workflows.
      - name: Dispatch the documentation workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main
