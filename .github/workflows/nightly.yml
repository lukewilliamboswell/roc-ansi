name: Nightly compatibility

# Examples archives from package release 0.13.3 use the canonical specification.
# The shared workflow selects one immutable release/compiler pair and owns
# validation, successful compiler diagnostics, execution and issue reporting.
on:
  schedule:
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      nightly-tag:
        description: "Exact nightly tag for a diagnostic rerun; empty resolves latest"
        type: string
        default: ""
      release-tag:
        description: "Exact final release tag for a diagnostic rerun; empty resolves latest"
        type: string
        default: ""

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/nightly-compatibility.yml@0ad737abd3cad3d14d7e409e91161cd42c05142c # verified manual badge evidence
    with:
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      release-tag: ${{ inputs.release-tag || '' }}
      runners: '["ubuntu-24.04"]'
