name: CI

# Checks the working tree. The scripts run on the tooling compiler that
# Blueprint.roc names; the package, its examples and what a release would
# publish are checked with the latest Roc nightly, which is not pinned.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-examples:
    # This name is a required status check in the branch ruleset.
    name: test-examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install blueprint without Nix
        uses: ./.github/actions/setup-blueprint

      - name: Install the latest Roc nightly
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler

      - name: Every task runs without Nix
        run: |
          if command -v nix; then
            echo "Nix must not be on PATH for this check" >&2
            exit 1
          fi
          blueprint check
          blueprint requirements --json | jq -e '.providers == [] and all(.tasks[]; .providers == [] and .unavailable == [])'

      - name: Check the scripts, package, examples and release artifacts
        run: blueprint run check
